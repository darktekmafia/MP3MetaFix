# User-service drop-in template. Replace %INSTALL_DIR% with the absolute checkout.
# No dedicated Unix account is implied by this profile.
[Service]
PrivateUsers=true
ProtectSystem=strict
ProtectHome=tmpfs
BindPaths=%INSTALL_DIR%
PrivateTmp=true
NoNewPrivileges=true
InaccessiblePaths=-/run/user/%U/bus -/run/dbus/system_bus_socket
ReadWritePaths=%INSTALL_DIR%
UMask=0077
MemoryMax=512M
TasksMax=64
CPUQuota=80%
