# MP3MetaFix Nginx Reverse Proxy Configuration
# Place in /etc/nginx/sites-available/mp3metafix or /etc/nginx/conf.d/mp3metafix.conf

server {
    listen 80;
    listen [::]:80;
    server_name mp3metafix.yourdomain.com;

    # Redirect all HTTP traffic to HTTPS (recommended for production)
    # return 301 https://$host$request_uri;

    # Maximum file upload size (matches backend limit)
    client_max_body_size 150M;

    # Logging
    access_log /var/log/nginx/mp3metafix_access.log;
    error_log /var/log/nginx/mp3metafix_error.log;

    location / {
        proxy_pass http://127.0.0.1:8844;
        proxy_http_version 1.1;

        # Standard Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # WebSocket / Streaming support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts for large audio uploads
        proxy_connect_timeout 90s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;

        # Buffering settings
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
